[build]
  command = "npm run build:netlify"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # esbuild quebra em runtime com firebase-admin: o jwks-rsa (usado por
  # firebase-admin/auth) faz require() do pacote "jose", que é ESM-only,
  # e o esbuild empacota tudo como CommonJS -> ERR_REQUIRE_ESM. O nft
  # (Node File Trace) não reescreve os módulos, só copia o que é
  # necessário do node_modules, então evita esse conflito.
  node_bundler = "nft"

# SPA: qualquer rota que não seja um arquivo real cai no index.html do React Router/estado interno do app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
