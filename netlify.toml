[build]
  command = "npm run build:netlify"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # "nft" não é um bundler válido do Netlify (as únicas opções são esbuild
  # e zisi) — e functions em TypeScript sempre usam esbuild de qualquer
  # forma. O crash real era o firebase-admin/jwks-rsa fazendo require() de
  # um pacote ESM-only (jose v6); resolvido removendo o firebase-admin/auth
  # da function e verificando o JWT manualmente com jose (import ESM direto).
  node_bundler = "esbuild"

# SPA: qualquer rota que não seja um arquivo real cai no index.html do React Router/estado interno do app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
